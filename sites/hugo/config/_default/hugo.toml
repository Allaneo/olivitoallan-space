baseURL = "https://olivitoallan.space/"
theme = "blowfish"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false
enableRobotsTXT = true
summaryLength = 30

[imaging]
  # Lanczos preserves fine detail (thin diagram lines, small labels) far better
  # than Hugo's default Box filter when resizing.
  resampleFilter = "Lanczos"
  quality = 92
  anchor = "Smart"

[pagination]
  pagerSize = 10

[permalinks]
  posts = "/posts/:slug/"
  page = "/:slug/"

[build]
  writeStats = true

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4
    ordered = true
  [markup.highlight]
    noClasses = false
    codeFences = true
    guessSyntax = true
    lineNos = true
    lineNumbersInTable = true
    style = "github"
    tabWidth = 4

[sitemap]
  changefreq = "weekly"
  priority = 0.5
  filename = "sitemap.xml"

[services]
  [services.rss]
    limit = 20

[params]
  debug = false
