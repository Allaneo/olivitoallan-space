{{ if and (isset site.Params "disclosure") (site.Params.disclosure.enabled) (site.Params.disclosure.text) }}
  <aside class="mt-4 mb-2 text-sm print:hidden">
    <div class="px-4 py-3 rounded-md bg-amber-100 text-amber-900 dark:bg-amber-900/30 dark:text-amber-200 border border-amber-200 dark:border-amber-800">
      {{ site.Params.disclosure.text }}
    </div>
  </aside>
{{ end }}
