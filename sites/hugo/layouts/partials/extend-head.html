{{- /* RSS Feed Autodiscovery (site context) */ -}}
<link rel="alternate" type="application/rss+xml" title="{{ .Title }} RSS Feed" href="{{ .BaseURL }}index.xml">

{{- /* Meta robots for non-production (site context) */ -}}
{{ if ne hugo.Environment "production" }}
  <meta name="robots" content="noindex,nofollow,noarchive">
{{ end }}

{{- /* Security headers */ -}}
{{ partial "head-security.html" . }}



{{- /* Reusable editorial fonts */ -}}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@500;600;700&family=Source+Serif+Pro:wght@400;600&display=swap" rel="stylesheet">
