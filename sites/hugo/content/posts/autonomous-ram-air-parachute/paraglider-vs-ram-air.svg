<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" role="img" aria-labelledby="title desc">
  <title id="title">Paraglider and ram-air parachute comparison</title>
  <desc id="desc">A simplified diagram comparing the slender curved planform of a ground-launched paraglider with the compact rectangular planform and large forward inlets of an air-deployed ram-air parachute.</desc>
  <rect width="1000" height="440" rx="24" fill="#f8fafc"/>
  <line x1="500" y1="42" x2="500" y2="398" stroke="#cbd5e1" stroke-width="2"/>

  <g font-family="Inter,Arial,sans-serif" fill="#0f172a">
    <text x="250" y="46" font-size="24" font-weight="700" text-anchor="middle">Paraglider / Parapente</text>
    <text x="250" y="70" font-size="16" text-anchor="middle" fill="#475569">Ground-launched / Despegue terrestre</text>
    <text x="750" y="46" font-size="24" font-weight="700" text-anchor="middle">Ram-air parachute / Paracaídas ram-air</text>
    <text x="750" y="70" font-size="16" text-anchor="middle" fill="#475569">Air-deployed / Despliegue en vuelo</text>
  </g>

  <g transform="translate(48 84)">
    <path d="M30 105 C125 10 345 10 440 105 C342 64 128 64 30 105 Z" fill="#38bdf8" stroke="#075985" stroke-width="5"/>
    <path d="M61 92 C155 50 315 50 409 92" fill="none" stroke="#e0f2fe" stroke-width="6" stroke-linecap="round"/>
    <g stroke="#64748b" stroke-width="2">
      <line x1="72" y1="99" x2="212" y2="270"/><line x1="160" y1="76" x2="220" y2="270"/>
      <line x1="310" y1="76" x2="230" y2="270"/><line x1="398" y1="99" x2="238" y2="270"/>
    </g>
    <circle cx="225" cy="279" r="11" fill="#0f172a"/>
    <path d="M225 290 L225 331 M225 306 L202 326 M225 306 L248 326 M225 331 L207 362 M225 331 L243 362" stroke="#0f172a" stroke-width="7" stroke-linecap="round"/>
    <g font-family="Inter,Arial,sans-serif" font-size="20" fill="#334155" text-anchor="middle">
      <text x="235" y="390">AR ≈ 5 to 6, thin profile / perfil delgado</text>
    </g>
  </g>

  <g transform="translate(542 84)">
    <path d="M42 78 Q225 18 408 78 L386 155 Q225 116 64 155 Z" fill="#f97316" stroke="#9a3412" stroke-width="5"/>
    <g fill="#fff7ed" stroke="#9a3412" stroke-width="2">
      <path d="M68 91 Q91 77 114 70 L111 132 Q88 137 67 142 Z"/>
      <path d="M125 67 Q148 60 171 56 L168 122 Q145 125 122 129 Z"/>
      <path d="M183 54 Q207 51 230 51 L230 116 Q207 117 184 120 Z"/>
      <path d="M242 52 Q265 54 288 58 L289 123 Q266 120 243 117 Z"/>
      <path d="M300 61 Q323 66 346 74 L354 137 Q332 131 309 126 Z"/>
    </g>
    <g stroke="#64748b" stroke-width="2">
      <line x1="75" y1="150" x2="210" y2="290"/><line x1="165" y1="123" x2="218" y2="290"/>
      <line x1="285" y1="123" x2="228" y2="290"/><line x1="375" y1="150" x2="236" y2="290"/>
    </g>
    <rect x="204" y="290" width="40" height="62" rx="6" fill="#0f172a"/>
    <g font-family="Inter,Arial,sans-serif" font-size="20" fill="#334155" text-anchor="middle">
      <text x="225" y="390">AR ≈ 1.8 to 2.2, large inlets / bocas grandes</text>
    </g>
  </g>
</svg>
